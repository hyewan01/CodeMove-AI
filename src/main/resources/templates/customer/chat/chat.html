<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{customer/fragments/common :: head('명품 상담')}"></head>
<body>
<div class="app-shell" th:classappend="${cs.easy} ? 'easy-mode'">
<!-- SCR-U-017~019 AI 챗봇 · 상담원 연결 · 파일 첨부 -->
<div class="screen chat-screen" data-chat th:data-url="@{/chat/messages}" th:data-mode="${chatMode}"
	 th:data-assets="@{/assets/}" th:data-link-move="@{/move}" th:data-link-quote="@{/quote}" th:data-link-estimates="@{/more/estimates}">
	<div class="chat-header">
		<a th:replace="~{customer/fragments/common :: back('/home')}"></a>
		<div class="chat-header-title">
			<strong>명품 상담</strong>
			<!-- 누가 답하는지: AI 이사 도우미 / 상담사와 대화 중 (상담 중이면 AI 는 답하지 않음) -->
			<span data-chat-mode th:text="${chatMode == 'counselor'} ? '상담사와 대화 중' : (${chatMode == 'waiting'} ? '상담사 연결 중' : 'AI 이사 도우미')">AI 이사 도우미</span>
		</div>
		<span></span>
	</div>
	<main class="chat-content">
		<th:block th:replace="~{customer/chat/start :: start(${greeting}, ${topics}, ${hours})}"></th:block>
		<div class="chat-restart-label" data-chat-restart hidden>상담 내용</div>
		<div class="chat-thread" aria-live="polite" data-chat-thread></div>
	</main>
	<div class="chat-input">
		<!-- 받는 쪽 고르기: AI 도우미 / 상담사 (관리자가 메시지를 보내면 상담사로 바뀜) -->
		<div class="chat-to" role="radiogroup" aria-label="메시지 받는 쪽">
			<button type="button" class="action" role="radio" data-chat-to="ai"
					th:aria-checked="${chatMode == 'ai'}" th:disabled="${chatMode == 'counselor'}">AI 도우미</button>
			<button type="button" class="action" role="radio" data-chat-to="counselor"
					th:aria-checked="${chatMode != 'ai'}">상담사</button>
		</div>
		<div class="chat-attachment-chip" data-chat-chip hidden>
			<img alt="" th:src="@{/assets/paperclip.svg}">
			<span data-chat-chip-name></span>
			<button type="button" class="action" aria-label="첨부 파일 제거" data-chat-chip-remove>×</button>
		</div>
		<div class="chat-input-row">
			<button type="button" class="action chat-attach" aria-label="파일 첨부" data-chat-attach>
				<img alt="" th:src="@{/assets/paperclip.svg}">
			</button>
			<input type="file" hidden data-chat-file accept="image/*,video/*,.pdf">
			<div aria-label="상담 내용 입력" class="chat-editor designed-scroll" contenteditable="true"
				 data-placeholder="상담할 내용을 입력해주세요" role="textbox" data-chat-editor></div>
			<button type="button" class="action chat-send is-disabled" aria-label="메시지 보내기" data-chat-send>
				<img alt="" th:src="@{/assets/send.svg}">
			</button>
		</div>
	</div>
	<!-- 내 메시지 고치기 (꾹 누르거나 오른쪽 클릭 → 수정) -->
	<div class="scrim" style="z-index: 60" data-chat-edit-scrim data-chat-edit-close hidden></div>
	<div class="chat-edit-sheet" role="dialog" aria-modal="true" aria-label="메시지 수정" data-chat-edit hidden>
		<strong>메시지 수정</strong>
		<textarea rows="4" maxlength="1000" data-chat-edit-text aria-label="고칠 내용"></textarea>
		<small>보낸 지 하루가 지나면 고칠 수 없어요. 상담사에게는 '수정됨'으로 보여요.</small>
		<div class="chat-edit-actions">
			<button type="button" class="action outline" data-chat-edit-close>취소</button>
			<button type="button" class="action primary" data-chat-edit-save>저장</button>
		</div>
	</div>
</div>
<script th:inline="javascript">
	/* 이전 상담 내용 (진행 중인 채팅방) */
	window.CHAT_HISTORY = /*[[${history}]]*/ [];
</script>
<script defer th:src="@{/js/chat.js}"></script>
</div>

</body>
</html>
