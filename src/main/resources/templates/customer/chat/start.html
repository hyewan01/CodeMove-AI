<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
	채팅 첫 화면: 인사말 · 퀵메뉴 (TBL_CHAT_SETTING.GREETING / TBL_QUICK_MENU + 상담사 연결) · 상담 운영시간.
	관리자 '첫화면/퀵메뉴 설정' 미리보기(/admin/chat-management/entry/preview)도 이 조각을 그대로 씀
-->
<th:block th:fragment="start(greeting, topics, hours)">
	<div class="chat-start-label">명품 상담을 시작했어요</div>
	<div class="chat-bot-row">
		<div class="chat-avatar"><img alt="명품 이사 도우미 캐릭터" th:src="@{/assets/mover-assistant-3d.svg}"></div>
		<div class="chat-bot-name">명품 이사 도우미</div>
	</div>
	<div class="chat-menu-card">
		<div class="chat-greeting" th:text="${greeting}">안녕하세요, 명품익스프레스입니다. 궁금하신 내용을 선택해주세요.</div>
		<div class="chat-topic-list">
			<button type="button" class="action chat-topic" th:each="t, st : ${topics}" th:classappend="${st.last} ? 'chat-topic-accent'"
					th:text="${t}" th:data-ask="${t}"></button>
		</div>
		<div class="chat-hours" th:if="${hours}" th:text="'상담 운영시간　' + ${hours}">상담 운영시간　09:00–18:00</div>
	</div>
</th:block>
</body>
</html>
