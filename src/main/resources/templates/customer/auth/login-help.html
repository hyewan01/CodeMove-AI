<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{customer/fragments/common :: head('번호가 바뀌었어요')}"></head>
<body>
<div class="app-shell" th:classappend="${cs.easy} ? 'easy-mode'">
<!-- 로그인 도움말: 휴대폰 번호가 바뀌었을 때 (휴대전화 로그인은 번호가 곧 계정이라 '계정 찾기' 대신 안내) -->
<div class="screen form-page">
	<div th:replace="~{customer/fragments/common :: formHead('/login/phone', null)}"></div>
	<div class="form-content lh-page">
		<p class="lh-title">휴대폰 번호가 바뀌었나요?</p>
		<p class="lh-lead">명품익스프레스는 휴대폰 번호로 계정을 찾아요.<br>번호가 바뀌었다면 아래 방법으로 들어와 주세요.</p>

		<div class="lh-card">
			<span class="lh-step">1</span>
			<div>
				<strong>카카오·네이버·애플을 연결해 두셨다면</strong>
				<p>간편 로그인으로 들어온 뒤 <b>더보기 → 내 정보 수정</b>에서 새 번호로 바꿀 수 있어요.</p>
				<a class="action lh-button" th:href="@{/login}">간편 로그인으로 들어가기</a>
			</div>
		</div>

		<div class="lh-card">
			<span class="lh-step">2</span>
			<div>
				<strong>연결한 간편 로그인이 없다면</strong>
				<p>새 번호로 다시 가입해 주세요. 이전 번호로 받은 견적·예약 내역은 업체에 문의하면 확인할 수 있어요.</p>
				<a class="action lh-button outline" th:href="@{/signup}">새 번호로 가입하기</a>
			</div>
		</div>
	</div>
</div>
</div>
</body>
</html>
