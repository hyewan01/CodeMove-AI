<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
	고객 > 견적 상세 > 견적서로 보기: 관리자 견적서와 똑같은 양식 · 보기 도구(− + 확대, 두 손가락 확대, PDF 다운).
	admin/fragments/estimate-sheet :: viewer 를 읽기 전용으로 그대로 씀. 관리자 CSS(Tailwind) · admin.js 를 쓰므로
	고객 화면과 섞이지 않게 이 페이지만 따로 그려 상세 화면의 iframe 에 넣습니다.
-->
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>견적서 | 명품익스프레스</title>
	<link rel="preload" th:href="@{/fonts/Pretendard-Regular.kr.woff2}" as="font" type="font/woff2" crossorigin>
	<link rel="preload" th:href="@{/fonts/Pretendard-Bold.kr.woff2}" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" th:href="@{/css/admin.css}">
	<script defer th:src="@{/js/admin.js}"></script>
	<style>
		html, body { margin: 0; height: 100%; background: transparent; }
		/* 관리자 화면은 창 높이에서 위아래 메뉴를 뺀 높이: 여기서는 iframe 높이에서 도구 줄만 뺌 */
		[data-doc-viewer] { border-radius: 0; box-shadow: none; }
		[data-doc-viewport] { height: calc(100vh - 52px) !important; }
	</style>
</head>
<body>
	<div th:replace="~{admin/fragments/estimate-sheet :: viewer(${doc}, false, true, ~{})}"></div>
</body>
</html>
