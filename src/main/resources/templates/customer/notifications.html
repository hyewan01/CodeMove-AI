<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{customer/fragments/common :: head('알림')}"></head>
<body>
<div class="app-shell" th:classappend="${cs.easy} ? 'easy-mode'">
<!-- SCR-U-030 알림 (종류별 보기) - TBL_NOTIFICATION -->
<div class="screen notifications-screen" data-notifications th:data-read-url="@{/notifications/read}">
	<div class="notification-header">
		<a th:replace="~{customer/fragments/common :: back('/home')}"></a>
		<div>알림</div>
		<form method="post" th:action="@{/notifications/read-all}">
			<button class="action" aria-label="모두 읽음">모두읽음</button>
		</form>
	</div>
	<div class="notification-controls">
		<span>읽지 않은 알림 <th:block th:text="${cs.unreadNotifications.size()}">3</th:block>건</span>
		<button type="button" class="action" aria-label="알림 종류 선택" data-modal-open="ntf-filter">
			<span data-ntf-label>전체알림</span>
			<img th:replace="~{customer/fragments/common :: chevron}">
		</button>
	</div>
	<div class="notification-day">어제</div>
	<div class="notification-feed">
		<button type="button" class="action notification-row" th:each="n : ${alerts}"
				th:classappend="${cs.unreadNotifications.contains(n.id)} ? 'unread'"
				th:aria-label="${n.title}" th:data-ntf-id="${n.id}" th:data-ntf-type="${n.type}">
			<div class="notification-type-icon" th:switch="${n.type}">
				<svg th:case="'예약/일정 정보'" aria-hidden="true" fill="none" viewBox="0 0 44 44">
					<rect fill="#EEF4F0" height="44" rx="13" width="44"/>
					<rect fill="white" height="25" rx="4" width="27" x="8.5" y="10.5"/>
					<path d="M8.5 16.5h27" stroke="#346538" stroke-width="3"/>
					<path d="M15 8.5v4M29 8.5v4" stroke="#346538" stroke-linecap="round" stroke-width="2"/>
					<path d="m16 26 3 3 8-8" stroke="#F5831A" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
				</svg>
				<svg th:case="'견적 정보'" aria-hidden="true" fill="none" viewBox="0 0 44 44">
					<rect fill="#F3F0FF" height="44" rx="13" width="44"/>
					<path d="M9 12a3 3 0 0 1 3-3h18l5 5v20a3 3 0 0 1-3 3H12a3 3 0 0 1-3-3V12Z" fill="white"/>
					<path d="M30 9v4a2 2 0 0 0 2 2h3" fill="#DCD8F6"/>
					<path d="M15 19h11M15 23h8M15 27h10" stroke="#7568D9" stroke-linecap="round" stroke-width="2"/>
					<circle cx="32.5" cy="31.5" fill="#F5831A" r="7.5"/>
					<path d="m29 31.5 2.2 2.2 4.3-4.4" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
				</svg>
				<svg th:case="'결제 정보'" aria-hidden="true" fill="none" viewBox="0 0 44 44">
					<rect fill="#FFFBF0" height="44" rx="13" width="44"/>
					<rect fill="#F5C65D" height="22" rx="5" width="29" x="7.5" y="12"/>
					<path d="M7.5 18h29" stroke="#D99A2B" stroke-width="3"/>
					<circle cx="31.5" cy="31.5" fill="#65BFA8" r="7.5"/>
					<path d="m28 31.5 2.2 2.2 4.3-4.4" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
				</svg>
				<svg th:case="*" aria-hidden="true" fill="none" viewBox="0 0 44 44">
					<rect fill="#F0F7FF" height="44" rx="13" width="44"/>
					<path d="M7.5 13.5c0-2.2 1.8-4 4-4h15c2.2 0 4 1.8 4 4v10c0 2.2-1.8 4-4 4H18l-6 5v-5h-.5c-2.2 0-4-1.8-4-4v-10Z" fill="#6CA8E8"/>
					<circle cx="15" cy="18.5" fill="white" r="1.5"/>
					<circle cx="20" cy="18.5" fill="white" r="1.5"/>
					<circle cx="25" cy="18.5" fill="white" r="1.5"/>
					<path d="M25 30h8.5c1.7 0 3-1.3 3-3v-8c0-1.7-1.3-3-3-3h-1" stroke="#7568D9" stroke-linecap="round" stroke-width="2"/>
				</svg>
			</div>
			<div class="notification-copy">
				<strong th:text="${n.title}"></strong>
				<p th:text="${n.body}"></p>
				<small th:text="${n.time}"></small>
			</div>
			<i th:if="${cs.unreadNotifications.contains(n.id)}"></i>
		</button>
	</div>

	<div class="notification-sheet-scrim" data-modal="ntf-filter" data-modal-close hidden></div>
	<div class="notification-filter-sheet" data-modal="ntf-filter" hidden>
		<div class="notification-sheet-head">
			<strong>보고싶은 알림 선택</strong>
			<button type="button" class="action" aria-label="알림 선택 닫기" data-modal-close>×</button>
		</div>
		<div class="notification-categories">
			<button type="button" class="action" th:each="c, st : ${categories}" th:classappend="${st.first} ? 'selected'"
					th:aria-label="${c}" th:data-ntf-filter="${c}" data-modal-close>
				<span th:text="${c}"></span>
				<b th:hidden="${!st.first}">✓</b>
			</button>
		</div>
	</div>
</div>
<script>
	(function () {
		const root = document.querySelector('[data-notifications]');
		const rows = root.querySelectorAll('[data-ntf-id]');
		/* 알림 읽음 처리 */
		rows.forEach((row) => row.addEventListener('click', () => {
			if (!row.classList.contains('unread')) return;
			row.classList.remove('unread');
			const dot = row.querySelector(':scope > i');
			if (dot) dot.remove();
			fetch(`${root.dataset.readUrl}/${row.dataset.ntfId}`, { method: 'POST' });
		}));
		/* 종류별 보기 */
		root.querySelectorAll('[data-ntf-filter]').forEach((btn) => btn.addEventListener('click', () => {
			const v = btn.dataset.ntfFilter;
			root.querySelector('[data-ntf-label]').textContent = v;
			root.querySelectorAll('[data-ntf-filter]').forEach((b) => {
				b.classList.toggle('selected', b === btn);
				b.querySelector('b').hidden = b !== btn;
			});
			rows.forEach((r) => (r.hidden = v !== '전체알림' && r.dataset.ntfType !== v));
		}));
	})();
</script>
</div>
</body>
</html>
