<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{customer/fragments/common :: head('예약내역')}"></head>
<body>
<div class="app-shell" th:classappend="${cs.easy} ? 'easy-mode'">
<!-- SCR-U-034 예약내역 (상태 필터) -->
<div class="screen form-page">
	<div th:replace="~{customer/fragments/common :: formHead('/more', '예약내역')}"></div>
	<div class="form-content reservation-history-page">
		<a class="action upcoming-reservation-card" aria-label="다가오는 예약 상세" th:href="@{/move/reservation}" th:if="${cs.estimateStatus == 'confirmed'}">
			<div class="upcoming-reservation-top">
				<div><span>확정</span><b th:text="${mv.dday}">D-30</b></div>
			</div>
			<div class="upcoming-reservation-route">
				<strong th:text="${mv.routeLabel}">강남구 → 서초구</strong>
				<img th:replace="~{customer/fragments/common :: chevron}">
			</div>
			<small th:text="${booking.dateLabel} + ' ' + ${booking.timeLabel} + ' · ' + ${booking.typeLabel}">3월 18일 (수) 오전 10:00 · 원룸 일반포장</small>
		</a>
		<div class="reservation-empty" th:unless="${cs.estimateStatus == 'confirmed'}">
			<strong>예정된 예약이 없습니다.</strong>
			<span>견적을 확정하면 예약 일정이 여기에 표시됩니다.</span>
		</div>

		<div class="reservation-past-head">
			<div class="reservation-past-title">
				<strong>지난 이사</strong>
				<span th:text="${pastCount}">3</span>
			</div>
			<div class="reservation-filter-wrap" data-filter-box>
				<button type="button" class="action reservation-filter-button" aria-label="지난 이사 필터 선택" data-filter-toggle>
					<span data-filter-label>전체</span>
					<img th:replace="~{customer/fragments/common :: chevron}">
				</button>
				<button type="button" class="action reservation-filter-dismiss" aria-label="지난 이사 필터 닫기" data-filter-dismiss hidden></button>
				<div class="reservation-filter-menu" role="menu" data-filter-menu hidden>
					<div class="reservation-filter-handle" aria-label="필터 선택 화면 닫기" role="button" tabindex="0" data-filter-handle><span></span></div>
					<div class="reservation-filter-options">
						<button type="button" class="action selected" data-filter-option="all" data-label="전체">전체<span>✓</span></button>
						<button type="button" class="action" data-filter-option="completed" data-label="완료">완료<span hidden>✓</span></button>
						<button type="button" class="action" data-filter-option="cancelled" data-label="취소">취소<span hidden>✓</span></button>
					</div>
				</div>
			</div>
		</div>

		<div class="past-reservation-list">
			<section class="past-reservation-year" th:each="entry : ${pastByYear}" data-filter-group>
				<div class="past-reservation-year-label" th:text="${entry.key}">2025년</div>
				<a class="action past-booking" th:each="r : ${entry.value}" th:classappend="${r.status}" th:data-filter-item="${r.status}"
				   th:href="@{/move/reservation}" th:aria-label="${r.date} + ' ' + ${r.route} + ' 예약 상세'">
					<div class="past-booking-main">
						<div class="past-booking-meta">
							<span th:text="${r.statusLabel}">완료</span>
							<small th:text="${r.date}">2025. 11. 02</small>
						</div>
						<strong th:text="${r.route}">송파구 → 성동구</strong>
						<small th:text="${r.meta}">원룸 · 반포장</small>
					</div>
					<img th:replace="~{customer/fragments/common :: chevron}">
				</a>
			</section>
			<div class="past-reservation-empty" data-filter-empty th:hidden="${pastCount > 0}">해당하는 예약 내역이 없어요.</div>
		</div>
	</div>
</div>
</div>
</body>
</html>
