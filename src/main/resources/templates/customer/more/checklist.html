<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{customer/fragments/common :: head('이사 준비 체크리스트')}"></head>
<body>
<div class="app-shell" th:classappend="${cs.easy} ? 'easy-mode'">
<!--
	이사 준비 체크리스트: 단계(한 달 전 ~ 이사 후)별 할 일. 기본 할 일은 checklist/move-checklist.csv,
	체크 상태 · 직접 넣은 할 일은 TBL_MOVE_CHECKLIST (이사마다 따로). 이사 날짜가 있으면 지금 할 단계를 펼쳐 둠
-->
<div class="screen form-page soft-page" data-checklist th:data-toggle-url="@{/more/checklist/toggle}">
	<div th:replace="~{customer/fragments/common :: formHead('/more', '이사 준비 체크리스트')}"></div>
	<div class="form-content cl-page">
		<section class="cl-summary">
			<div class="cl-summary-top">
				<div>
					<span th:text="${#strings.isEmpty(cl.moveDate)} ? '이사 날짜 미정' : ${cl.moveDate} + ' 이사'">2026. 12. 06 이사</span>
					<strong th:text="${#strings.isEmpty(cl.dday)} ? '미리 준비해요' : ${cl.dday}">D-12</strong>
				</div>
				<b><em data-cl-done th:text="${cl.done}">0</em> / <th:block th:text="${cl.total}">36</th:block></b>
			</div>
			<div class="cl-bar" role="progressbar" aria-label="체크리스트 진행" aria-valuemin="0" aria-valuemax="100"
				 th:aria-valuenow="${cl.percent()}"><i data-cl-bar th:style="'width:' + ${cl.percent()} + '%'"></i></div>
			<small th:text="${cl.nowPhase != null} ? '지금은 「' + ${cl.nowLabel()} + '」 할 일을 챙길 때예요.' : '이사 날짜를 정하면 지금 할 일을 알려드려요.'">지금 할 일</small>
		</section>

		<section class="cl-phase" th:each="p : ${cl.phases}" th:id="'phase-' + ${p.code}" th:classappend="${p.now} ? 'now'">
			<details th:open="${p.now or cl.nowPhase == null and p.code == '01'}">
				<summary>
					<span class="cl-when" th:text="${p.when}">D-30</span>
					<strong th:text="${p.label}">한 달 전</strong>
					<em th:if="${p.now}">지금</em>
					<small><b data-cl-phase-done th:text="${p.done}">0</b>/<th:block th:text="${#lists.size(p.items)}">5</th:block></small>
				</summary>
				<ul class="cl-items">
					<li th:each="it : ${p.items}" th:classappend="${it.done} ? 'done'">
						<button type="button" class="action cl-check" role="checkbox" th:aria-checked="${it.done}"
								th:aria-label="${it.title}" th:data-cl-id="${it.id}">
							<span class="cl-box" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3.5 8.5 6.5 11.5 12.5 4.5"/></svg></span>
						</button>
						<div class="cl-copy">
							<strong th:text="${it.title}">할 일</strong>
							<p th:unless="${#strings.isEmpty(it.detail)}" th:text="${it.detail}">설명</p>
							<div class="cl-meta" th:if="${!#strings.isEmpty(it.where) or !#strings.isEmpty(it.link)}">
								<span th:unless="${#strings.isEmpty(it.where)}" th:text="${it.where}">관리사무소</span>
								<a th:unless="${#strings.isEmpty(it.link)}" th:href="@{${it.link}}">바로 가기</a>
							</div>
						</div>
						<form th:if="${it.custom}" method="post" th:action="@{/more/checklist/items/{id}/delete(id=${#strings.substring(it.id, 1)})}">
							<input type="hidden" name="phase" th:value="${p.code}">
							<button class="action cl-delete" th:aria-label="${it.title} + ' 지우기'">×</button>
						</form>
					</li>
				</ul>
				<form class="cl-add" method="post" th:action="@{/more/checklist/items}">
					<input type="hidden" name="phase" th:value="${p.code}">
					<input type="text" name="title" maxlength="100" placeholder="할 일 직접 추가" required th:aria-label="${p.label} + ' 할 일 추가'">
					<button class="action">추가</button>
				</form>
			</details>
		</section>
		<p class="flow-help">체크한 내용은 저장돼요. 새로 이사를 신청하면 새 체크리스트로 시작해요.</p>
	</div>
</div>
<script>
	(function () {
		const root = document.querySelector('[data-checklist]');
		root.querySelectorAll('[data-cl-id]').forEach((b) => b.addEventListener('click', async () => {
			const li = b.closest('li');
			const phase = b.closest('details');
			b.disabled = true;
			try {
				const r = await fetch(root.dataset.toggleUrl, {
					method: 'POST', credentials: 'same-origin',
					headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
					body: 'id=' + encodeURIComponent(b.dataset.clId),
				});
				if (!r.ok) throw new Error(r.status);
				const res = await r.json();
				li.classList.toggle('done', res.done);
				b.setAttribute('aria-checked', String(res.done));
				phase.querySelector('[data-cl-phase-done]').textContent = phase.querySelectorAll('li.done').length;
				root.querySelector('[data-cl-done]').textContent = res.doneCount;
				root.querySelector('[data-cl-bar]').style.width = res.percent + '%';
			} catch (e) {
				alert('저장하지 못했어요. 잠시 후 다시 눌러 주세요.');
			} finally {
				b.disabled = false;
			}
		}));
	})();
</script>
</div>
</body>
</html>
