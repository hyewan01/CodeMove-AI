<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{customer/fragments/common :: head('견적내역')}"></head>
<body>
<div class="app-shell" th:classappend="${cs.easy} ? 'easy-mode'">
<!-- SCR-U-033 견적내역 (상태 필터) -->
<div class="screen form-page">
	<div th:replace="~{customer/fragments/common :: formHead('/more', '견적내역')}"></div>
	<div class="form-content estimate-history-page">
		<a class="action estimate-arrived-card" aria-label="도착한 견적 상세" th:href="@{/move/estimate}" th:if="${cs.estimateStatus != 'none'}">
			<div class="estimate-arrived-top">
				<span>견적 도착</span>
				<b>
					<svg aria-hidden="true" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><path d="M10 5.7v4.7l3.2 1.8"/></svg>
					2일 13시간 남음
				</b>
			</div>
			<div class="estimate-arrived-route">
				<strong>서초구 → 강동구</strong>
				<img th:replace="~{customer/fragments/common :: chevron}">
			</div>
			<small>5월 2일 (토) 이사 · 380,000원</small>
		</a>

		<div class="estimate-list-head">
			<div>
				<strong>견적 목록</strong>
				<span th:text="${estimates.size()}">2</span>
			</div>
			<div class="estimate-filter-wrap" data-filter-box>
				<button type="button" class="action estimate-filter-button" aria-label="견적 목록 필터 선택" data-filter-toggle>
					<span data-filter-label>전체</span>
					<img th:replace="~{customer/fragments/common :: chevron}">
				</button>
				<button type="button" class="action reservation-filter-dismiss" aria-label="견적 목록 필터 닫기" data-filter-dismiss hidden></button>
				<div class="reservation-filter-menu" role="menu" data-filter-menu hidden>
					<div class="reservation-filter-handle" aria-label="필터 선택 화면 닫기" role="button" tabindex="0" data-filter-handle><span></span></div>
					<div class="reservation-filter-options">
						<button type="button" class="action selected" data-filter-option="all" data-label="전체">전체<span>✓</span></button>
						<button type="button" class="action" data-filter-option="reviewing" data-label="검토 중">검토 중<span hidden>✓</span></button>
						<button type="button" class="action" data-filter-option="expired" data-label="만료">만료<span hidden>✓</span></button>
					</div>
				</div>
			</div>
		</div>

		<div class="estimate-history-list">
			<a class="action estimate-history-row" th:each="e : ${estimates}" th:classappend="${e.status}"
			   th:data-filter-item="${e.status}" th:href="@{/move/estimate}" th:aria-label="${e.date} + ' ' + ${e.route} + ' 견적 상세'">
				<div class="estimate-history-main">
					<div class="estimate-history-meta">
						<span th:text="${e.statusLabel}">검토 중</span>
						<small th:text="${e.date}">2026. 06. 10</small>
					</div>
					<strong th:text="${e.route}">서초구 → 마포구</strong>
					<small th:text="${e.meta}">투룸 · 반포장</small>
				</div>
				<img th:replace="~{customer/fragments/common :: chevron}">
			</a>
			<div class="past-reservation-empty" data-filter-empty th:hidden="${!estimates.isEmpty()}">해당하는 견적 내역이 없어요.</div>
		</div>
	</div>
</div>
</div>
</body>
</html>
