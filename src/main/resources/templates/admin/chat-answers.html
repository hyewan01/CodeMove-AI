<!DOCTYPE html>
<html th:replace="~{admin/fragments/layout :: layout('답변 설정 관리', '', true, ~{::content})}" lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 답변 설정 관리 (SCR-A-010): 주제별 AI 답변과 로어북 -->
<th:block th:fragment="content">
<div class="relative flex h-full min-h-0 flex-col overflow-hidden bg-[#f5f6f8]" data-answers>
	<header class="relative flex h-14 shrink-0 items-center justify-center border-b border-[#e5e9e5] bg-white">
		<h1 class="text-base font-extrabold text-[#29322b]">답변 설정 관리</h1>
		<a aria-label="답변 설정 닫기" class="absolute right-3 grid h-10 w-10 place-items-center rounded-full" th:href="@{/admin/chat-management}">
			<svg th:replace="~{admin/fragments/icon :: icon2('x', 20, '')}"></svg></a>
	</header>
	<div class="flex items-center gap-2 p-4 pb-2">
		<label class="flex min-w-0 flex-1 items-center gap-2 rounded-full bg-white px-4 py-3 shadow-[0_3px_12px_rgba(36,58,39,.05)]">
			<svg th:replace="~{admin/fragments/icon :: icon2('search', 17, 'text-[#8b928d]')}"></svg>
			<input class="min-w-0 flex-1 bg-transparent text-sm outline-none placeholder:text-[#9ca29e]" placeholder="검색어를 입력하세요" data-topic-query>
		</label>
		<a class="grid h-11 shrink-0 place-items-center rounded-full bg-[#346538] px-4 text-xs font-bold text-white" th:href="@{/admin/chat-management/answers(edit='new')}">+ 등록</a>
	</div>
	<div class="flex-1 space-y-2 overflow-y-auto p-4 pt-2">
		<section th:each="topic : ${topics}" class="overflow-hidden rounded-2xl border border-white bg-white shadow-[0_3px_12px_rgba(36,58,39,.05)]"
				 th:data-search="${topic.title} + ' ' + ${topic.introduction}" data-topic>
			<div th:aria-expanded="${topic.id == expandedId}" class="flex w-full cursor-pointer items-center gap-2 p-4 text-left" role="button" tabindex="0" data-topic-toggle>
				<span class="min-w-0 flex-1">
					<strong class="block text-sm text-[#303832]" th:text="${topic.title}"></strong>
					<span class="mt-1 block truncate text-xs text-[#8a918c]" th:text="${topic.introduction}"></span>
				</span>
				<a th:aria-label="${topic.title} + ' 수정'" class="grid h-8 w-8 place-items-center rounded-lg bg-[#f2f5f2] text-[#346538]"
				   th:href="@{/admin/chat-management/answers(edit=${topic.id})}" data-stop><svg th:replace="~{admin/fragments/icon :: icon2('edit', 15, '')}"></svg></a>
				<button th:aria-label="${topic.title} + ' 삭제'" class="grid h-8 w-8 place-items-center rounded-lg bg-[#fff0ee] text-[#b64b42]" type="button"
						th:data-delete-topic="@{/admin/chat-management/answers/{id}/delete(id=${topic.id})}" data-stop><svg th:replace="~{admin/fragments/icon :: icon2('trash', 15, '')}"></svg></button>
			</div>
			<div class="border-t border-[#edf0ed] bg-[#fafbfa] px-4 py-3" th:hidden="${topic.id != expandedId}" data-topic-body>
				<div class="mb-3 last:mb-0" th:each="entry : ${topic.lorebooks}">
					<div class="flex flex-wrap gap-1">
						<span th:each="k : ${entry.keywordList()}" class="rounded-full bg-[#e9f1e9] px-2 py-1 text-[10px] font-bold text-[#346538]" th:text="'#' + ${k}"></span>
					</div>
					<p class="mt-2 text-xs leading-5 text-[#626a64]" th:text="${entry.content}"></p>
				</div>
			</div>
		</section>
		<p class="py-16 text-center text-sm text-[#858d87]" data-topic-empty th:hidden="${!#lists.isEmpty(topics)}">검색 결과가 없습니다.</p>
	</div>

	<!-- 답변 등록 / 수정 -->
	<form th:if="${draft}" class="absolute inset-0 z-40 flex flex-col bg-[#f5f6f8]" method="post" th:action="@{/admin/chat-management/answers}" data-topic-editor>
		<input type="hidden" name="id" th:value="${draft.id}">
		<header class="relative flex h-14 shrink-0 items-center justify-center border-b border-[#e5e9e5] bg-white">
			<h2 class="text-base font-extrabold text-[#303832]" th:text="${isNew} ? '답변 등록' : '답변 수정'">답변 등록</h2>
			<a aria-label="답변 편집 닫기" class="absolute right-3 grid h-10 w-10 place-items-center rounded-full" th:href="@{/admin/chat-management/answers}">
				<svg th:replace="~{admin/fragments/icon :: icon2('x', 20, '')}"></svg></a>
		</header>
		<div class="flex-1 overflow-y-auto p-4">
			<section class="space-y-3 rounded-[18px] bg-white p-4">
				<input class="h-12 w-full rounded-xl border border-[#dfe4df] bg-[#f7f8f7] px-3 text-sm font-semibold outline-none focus:border-[#89a18b]"
					   name="title" th:value="${draft.title}" placeholder="주제 제목을 입력하세요" data-required>
				<textarea class="h-24 w-full resize-none rounded-xl border border-[#dfe4df] bg-[#f7f8f7] p-3 text-sm leading-5 outline-none focus:border-[#89a18b]"
						  name="introduction" th:text="${draft.introduction}" placeholder="주제 제목과 함께 보일 짧은 소개를 입력해주세요" data-required></textarea>
			</section>
			<div class="mb-3 mt-5 flex items-center justify-between">
				<div>
					<h3 class="text-sm font-extrabold text-[#303832]">로어북</h3>
					<p class="mt-1 text-[10px] text-[#8a918c]">키워드에 따라 AI에게 전달할 내용을 설정합니다</p>
				</div>
				<button class="rounded-xl bg-[#edf3ed] px-3 py-2 text-xs font-bold text-[#346538]" type="button" data-lore-add>+ 등록</button>
			</div>
			<div class="space-y-3" data-lore-list>
				<section th:each="entry, it : ${draft.lorebooks}" class="relative rounded-[18px] bg-white p-4" data-lore>
					<input type="hidden" th:name="'lorebooks[' + ${it.index} + '].id'" th:value="${entry.id}" data-lore-field="id">
					<div class="mb-3 flex items-center justify-between">
						<strong class="text-xs text-[#59615b]" data-lore-title th:text="'로어북 ' + ${it.count}">로어북 1</strong>
						<button th:aria-label="'로어북 ' + ${it.count} + ' 삭제'" class="grid h-8 w-8 place-items-center rounded-lg bg-[#fff0ee] text-[#b64b42]" type="button" data-lore-remove>
							<svg th:replace="~{admin/fragments/icon :: icon2('trash', 15, '')}"></svg></button>
					</div>
					<label class="block">
						<span class="mb-2 block text-[10px] leading-4 text-[#7e8680]">키워드를 #으로 구분해 입력해주세요. 띄어쓰기 시 #이 자동 생성됩니다.</span>
						<input class="h-11 w-full rounded-xl border border-[#dfe4df] bg-[#f7f8f7] px-3 text-sm outline-none focus:border-[#89a18b]"
							   th:name="'lorebooks[' + ${it.index} + '].keywords'" th:value="${entry.keywords}" placeholder="#견적 #비용 #가격" data-lore-field="keywords" data-keywords>
					</label>
					<label class="mt-4 block">
						<span class="mb-2 block text-[10px] leading-4 text-[#7e8680]">키워드 언급 시 고객에게 전달할 내용을 입력해주세요. (글자 수 제한 없음)</span>
						<textarea class="h-28 w-full resize-none rounded-xl border border-[#dfe4df] bg-[#f7f8f7] p-3 text-sm leading-5 outline-none focus:border-[#89a18b]"
								  th:name="'lorebooks[' + ${it.index} + '].content'" th:text="${entry.content}" placeholder="고객에게 전달할 답변을 입력하세요" data-lore-field="content"></textarea>
					</label>
				</section>
			</div>
		</div>
		<div class="shrink-0 border-t border-[#e5e9e5] bg-white p-3">
			<button class="h-12 w-full rounded-xl bg-[#346538] text-sm font-extrabold text-white disabled:bg-[#bcc5bd]" type="submit" data-topic-submit th:text="${isNew} ? '등록' : '수정'">등록</button>
		</div>
	</form>

	<!-- 주제 삭제 확인 -->
	<form class="absolute inset-0 z-50 grid place-items-center bg-[#1f2d21]/45 p-6 backdrop-blur-[2px]" method="post" data-topic-delete hidden>
		<div class="w-full rounded-[22px] bg-white p-5 text-center shadow-[0_20px_50px_rgba(25,42,28,.24)]">
			<span class="mx-auto grid h-12 w-12 place-items-center rounded-full bg-[#fff0ee] text-[#b64b42]"><svg th:replace="~{admin/fragments/icon :: icon2('trash', 21, '')}"></svg></span>
			<h2 class="mt-4 text-base font-extrabold text-[#303832]">정말 삭제하시겠습니까?</h2>
			<p class="mt-2 text-xs text-[#8a918c]">삭제된 데이터는 복구할 수 없습니다.</p>
			<div class="mt-5 grid grid-cols-2 gap-2">
				<button class="h-11 rounded-xl bg-[#f0f2f0] text-sm font-bold text-[#646c66]" type="button" data-topic-delete-cancel>취소</button>
				<button class="h-11 rounded-xl bg-[#c65249] text-sm font-bold text-white" type="submit">삭제</button>
			</div>
		</div>
	</form>
</div>
<script>
	(function () {
		const root = document.querySelector('[data-answers]');
		const $$ = (s, r = root) => [...r.querySelectorAll(s)];

		/* 검색 · 펼치기 */
		const topics = $$('[data-topic]');
		root.querySelector('[data-topic-query]').addEventListener('input', (e) => {
			const q = e.target.value.trim().toLocaleLowerCase();
			let n = 0;
			topics.forEach((t) => { const show = !q || t.dataset.search.toLocaleLowerCase().includes(q); t.hidden = !show; if (show) n++; });
			root.querySelector('[data-topic-empty]').hidden = n > 0;
		});
		topics.forEach((t) => {
			const head = t.querySelector('[data-topic-toggle]');
			const toggle = () => {
				const open = t.querySelector('[data-topic-body]').hidden;
				topics.forEach((o) => { o.querySelector('[data-topic-body]').hidden = true; o.querySelector('[data-topic-toggle]').setAttribute('aria-expanded', 'false'); });
				t.querySelector('[data-topic-body]').hidden = !open;
				head.setAttribute('aria-expanded', String(open));
			};
			head.addEventListener('click', (e) => { if (!e.target.closest('[data-stop]')) toggle(); });
			head.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
		});

		/* 삭제 확인 */
		const del = root.querySelector('[data-topic-delete]');
		$$('[data-delete-topic]').forEach((b) => b.addEventListener('click', () => { del.action = b.dataset.deleteTopic; del.hidden = false; }));
		root.querySelector('[data-topic-delete-cancel]').addEventListener('click', () => (del.hidden = true));

		/* 편집: 제목·소개 필수, 로어북 추가·삭제, 키워드 띄어쓰기 → # */
		const editor = root.querySelector('[data-topic-editor]');
		if (!editor) return;
		const submit = editor.querySelector('[data-topic-submit]');
		const required = $$('[data-required]', editor);
		const refresh = () => (submit.disabled = required.some((f) => !f.value.trim()));
		required.forEach((f) => f.addEventListener('input', refresh));
		refresh();

		const list = editor.querySelector('[data-lore-list]');
		const template = list.querySelector('[data-lore]').cloneNode(true);
		const renumber = () => $$('[data-lore]', list).forEach((lore, i) => {
			lore.querySelector('[data-lore-title]').textContent = `로어북 ${i + 1}`;
			lore.querySelector('[data-lore-remove]').setAttribute('aria-label', `로어북 ${i + 1} 삭제`);
			$$('[data-lore-field]', lore).forEach((f) => (f.name = `lorebooks[${i}].${f.dataset.loreField}`));
		});
		const bindKeywords = (input) => input.addEventListener('keydown', (e) => {
			if (e.key !== ' ') return;
			e.preventDefault();
			const start = input.selectionStart ?? input.value.length;
			const end = input.selectionEnd ?? start;
			const before = input.value.slice(0, start).trimEnd();
			const after = input.value.slice(end).trimStart();
			const sep = before.endsWith('#') ? ' ' : ' #';
			input.value = `${before}${sep}${after}`;
			const pos = before.length + sep.length;
			input.setSelectionRange(pos, pos);
		});
		$$('[data-keywords]', editor).forEach(bindKeywords);
		list.addEventListener('click', (e) => {
			const remove = e.target.closest('[data-lore-remove]');
			if (!remove) return;
			remove.closest('[data-lore]').remove();
			renumber();
		});
		editor.querySelector('[data-lore-add]').addEventListener('click', () => {
			const lore = template.cloneNode(true);
			$$('[data-lore-field]', lore).forEach((f) => (f.value = f.dataset.loreField === 'id' ? '0' : ''));
			list.appendChild(lore);
			bindKeywords(lore.querySelector('[data-keywords]'));
			renumber();
		});
	})();
</script>
</th:block>
</body>
</html>
