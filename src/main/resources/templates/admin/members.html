<!DOCTYPE html>
<html th:replace="~{admin/fragments/layout :: layout('회원 관리', '', false, ~{::content})}" lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 회원 관리 (SCR-A-023) -->
<th:block th:fragment="content">
<div class="space-y-5 px-4 pb-28 pt-6"
	 th:with="baseUrl=@{/admin/members(type=${type},q=${q})}, listUrl=${baseUrl} + '&page=' + ${page}">
	<h2 class="px-1 text-[24px] font-extrabold tracking-[-0.04em] text-[#346538]">회원 관리</h2>
	<section class="overflow-visible rounded-[20px] bg-white shadow-[0_5px_18px_rgba(36,58,39,.06)]">
		<form class="p-4" method="get" th:action="@{/admin/members}">
			<h3 class="text-[16px] font-extrabold text-[#29312b]">회원 관리 목록</h3>
			<div class="relative mt-3 flex items-center gap-2">
				<select class="h-9 rounded-lg border border-[#dfe4df] bg-white px-2 text-[10px] font-semibold" name="type" data-auto-submit>
					<option th:each="t : ${ {'전체', '고객', '관리자'} }" th:value="${t}" th:text="${t}" th:selected="${t == type}"></option>
				</select>
				<div class="ml-auto flex items-center gap-1">
					<a class="grid h-9 place-items-center rounded-lg bg-[#346538] px-3 text-[10px] font-bold text-white" th:href="${listUrl} + '&modal=register'">+ 등록</a>
					<button aria-label="회원 검색" type="button" data-toggle="search" th:aria-expanded="${!#strings.isEmpty(q)}"
							class="grid h-9 w-9 place-items-center rounded-lg border border-[#dfe4df] text-[#59625b] aria-expanded:border-[#346538] aria-expanded:bg-[#edf3ed] aria-expanded:text-[#346538]">
						<svg th:replace="~{admin/fragments/icon :: icon('search', 16, '')}"></svg>
					</button>
				</div>
				<div class="absolute bottom-11 right-0 z-10 flex items-center gap-2 rounded-xl border border-[#e1e5e1] bg-white p-3 shadow-[0_10px_28px_rgba(36,58,39,.15)]"
					 data-toggle-target="search" th:hidden="${#strings.isEmpty(q)}">
					<input class="h-9 w-44 rounded-lg border border-[#dfe4df] px-3 text-[10px] outline-none focus:border-[#346538]"
						   name="q" th:value="${q}" placeholder="이름을 입력하세요">
					<a aria-label="검색 및 필터 초기화" class="flex h-9 shrink-0 items-center gap-1 rounded-lg bg-[#edf3ed] px-2.5 text-[9px] font-bold text-[#346538]" th:href="@{/admin/members}">
						<svg th:replace="~{admin/fragments/icon :: icon('refresh', 14, '')}"></svg> 초기화
					</a>
				</div>
			</div>
		</form>
		<div class="grid grid-cols-[32px_64px_1fr_55px] bg-[#f7f8f7] px-3 py-2.5 text-center text-[9px] font-bold text-[#89908b]">
			<span>번호</span><span>분류</span><span>이름</span><span>수정/삭제</span>
		</div>
		<div class="px-3">
			<div th:each="m, it : ${rows}" class="relative grid grid-cols-[32px_64px_1fr_55px] items-center border-b border-[#edf0ed] py-3.5 text-[10px] last:border-none hover:bg-[#fafbfa]">
				<a class="absolute inset-0" th:href="${listUrl} + '&modal=detail&id=' + ${m.id}" th:aria-label="${m.name} + ' 상세 정보'"></a>
				<span class="text-center text-[#8b928d]" th:text="${rowOffset + it.count}">1</span>
				<span class="justify-self-center rounded-full px-2 py-1 text-[9px] font-bold"
					  th:classappend="${m.type == '관리자'} ? 'bg-[#fff1e8] text-[#ba6a35]' : 'bg-[#edf3f8] text-[#4d7599]'" th:text="${m.type}">고객</span>
				<span class="truncate px-1 font-semibold text-[#424a44]" th:text="${m.name}">홍길동</span>
				<div class="relative flex justify-end">
					<a class="grid h-7 w-7 place-items-center text-[#4f80ac]" th:aria-label="${m.name} + ' 권한 수정'" th:href="${listUrl} + '&modal=edit&id=' + ${m.id}">
						<svg th:replace="~{admin/fragments/icon :: icon('edit', 14, '')}"></svg>
					</a>
					<a class="grid h-7 w-7 place-items-center text-[#c7635a]" th:aria-label="${m.name} + ' 삭제'" th:href="${listUrl} + '&modal=delete&id=' + ${m.id}">
						<svg th:replace="~{admin/fragments/icon :: icon('trash', 14, '')}"></svg>
					</a>
				</div>
			</div>
		</div>
		<div th:replace="~{admin/fragments/list :: pager(${baseUrl})}"></div>
	</section>

	<div th:if="${modal == 'register' or selected != null}"
		 class="absolute inset-x-0 my-0 bottom-[82px] top-[68px] z-50 grid place-items-center overflow-y-auto bg-[#1f2d21]/45 p-5 backdrop-blur-[2px]">
		<div class="my-auto w-full rounded-[20px] bg-white p-5 shadow-2xl">

			<!-- 회원 등록 -->
			<form th:if="${modal == 'register'}" method="post" th:action="@{/admin/members}" data-member-register>
				<div class="flex items-center justify-between"><h3 class="text-[17px] font-extrabold">회원 등록</h3>
					<a aria-label="닫기" th:href="${listUrl}"><svg th:replace="~{admin/fragments/icon :: icon('x', 18, '')}"></svg></a></div>
				<div class="mt-4 space-y-3">
					<label class="block" th:each="f : ${ { {'name', '이름', 'text', ''}, {'phone', '연락처', 'tel', ''}, {'joined', '가입일', 'text', 'YYYY.MM.DD'} } }">
						<span class="mb-1 block text-[9px] font-bold text-[#6b736d]" th:text="${f[1]}">이름</span>
						<input class="h-10 w-full rounded-lg border border-[#dfe4df] px-3 text-[11px] outline-none focus:border-[#346538]"
							   th:name="${f[0]}" th:type="${f[2]}" th:placeholder="${f[3]}" required>
					</label>
					<div class="block">
						<span class="mb-1 block text-[9px] font-bold text-[#6b736d]">분류</span>
						<input type="hidden" name="type" value="고객" data-type-value>
						<button class="flex h-10 w-full items-center justify-between rounded-lg border border-[#dfe4df] bg-white px-3 text-left text-[11px] font-semibold outline-none focus:border-[#346538]"
								type="button" data-toggle="member-type">
							<span data-type-label>고객</span>
							<svg th:replace="~{admin/fragments/icon :: icon('chevron', 14, 'text-[#737b75]')}"></svg>
						</button>
						<div class="mt-1.5 overflow-hidden rounded-lg border border-[#dfe4df] bg-white shadow-[0_8px_20px_rgba(36,58,39,.12)]" data-toggle-target="member-type" hidden>
							<button th:each="t : ${ {'고객', '관리자'} }" type="button" th:data-type-option="${t}" th:text="${t}"
									class="flex h-10 w-full items-center border-b border-[#edf0ed] px-3 text-left text-[11px] font-semibold text-[#59625b] last:border-none aria-selected:bg-[#edf3ed] aria-selected:text-[#346538]"
									th:aria-selected="${t == '고객'}">고객</button>
						</div>
					</div>
				</div>
				<div class="mt-5 grid grid-cols-2 gap-2">
					<a class="grid h-11 place-items-center rounded-xl border border-[#d9ded9] text-[11px] font-bold" th:href="${listUrl}">취소</a>
					<button class="h-11 rounded-xl bg-[#346538] text-[11px] font-bold text-white disabled:opacity-40" type="submit" disabled data-register-submit>등록</button>
				</div>
			</form>

			<!-- 회원 상세 정보 -->
			<th:block th:if="${modal == 'detail' and selected != null}">
				<div class="flex items-center justify-between"><h3 class="text-[17px] font-extrabold">회원 상세 정보</h3>
					<a aria-label="닫기" th:href="${listUrl}"><svg th:replace="~{admin/fragments/icon :: icon('x', 18, '')}"></svg></a></div>
				<div class="mt-5 text-center">
					<span class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-[#edf3ed] text-[18px] font-extrabold text-[#346538]" th:text="${selected.initial()}">홍</span>
					<p class="mt-2 text-[15px] font-extrabold" th:text="${selected.name}">홍길동</p>
				</div>
				<div class="mt-5 divide-y divide-[#edf0ed] rounded-xl bg-[#f8f9f8] px-4">
					<div class="flex justify-between py-2.5 text-[10px]" th:each="f : ${ { {'이름', selected.name}, {'연락처', selected.phone}, {'가입일', #strings.isEmpty(selected.joined) ? '-' : selected.joined}, {'분류', selected.type} } }">
						<span class="font-bold text-[#737b75]" th:text="${f[0]}"></span><span class="text-[#444c46]" th:text="${f[1]}"></span>
					</div>
				</div>
				<a class="mt-5 grid h-11 w-full place-items-center rounded-xl bg-[#346538] text-[11px] font-bold text-white" th:href="${listUrl}">닫기</a>
			</th:block>

			<!-- 회원 권한 변경 -->
			<form th:if="${modal == 'edit' and selected != null}" method="post" th:action="@{/admin/members/{id}/type(id=${selected.id})}">
				<input type="hidden" name="back" th:value="${listUrl}">
				<div class="flex items-center justify-between"><h3 class="text-[17px] font-extrabold">회원 권한 변경</h3>
					<a aria-label="닫기" th:href="${listUrl}"><svg th:replace="~{admin/fragments/icon :: icon('x', 18, '')}"></svg></a></div>
				<div class="mt-4 rounded-xl bg-[#f5f7f5] p-4 text-[11px]"><strong th:text="${selected.name}"></strong><p class="mt-1 text-[#7b837d]" th:text="${selected.phone}"></p></div>
				<p class="mt-5 text-[10px] font-bold">분류 (권한)</p>
				<div class="mt-3 flex gap-5">
					<label class="flex items-center gap-2 text-[11px] font-semibold" th:each="t : ${ {'고객', '관리자'} }">
						<input name="type" type="radio" th:value="${t}" th:checked="${selected.type == t}"><th:block th:text="${t}"></th:block>
					</label>
				</div>
				<div class="mt-6 grid grid-cols-2 gap-2">
					<a class="grid h-11 place-items-center rounded-xl border border-[#d9ded9] text-[11px] font-bold" th:href="${listUrl}">취소</a>
					<button class="h-11 rounded-xl bg-[#346538] text-[11px] font-bold text-white" type="submit">저장</button>
				</div>
			</form>

			<!-- 회원 삭제 -->
			<form th:if="${modal == 'delete' and selected != null}" method="post" th:action="@{/admin/members/{id}/delete(id=${selected.id})}">
				<input type="hidden" name="back" th:value="${listUrl}">
				<h3 class="text-center text-[17px] font-extrabold">정말 삭제하시겠습니까?</h3>
				<p class="mt-2 text-center text-[10px] text-[#8b928d]">삭제된 데이터는 복구할 수 없습니다.</p>
				<div class="mt-6 grid grid-cols-2 gap-2">
					<a class="grid h-11 place-items-center rounded-xl border border-[#d9ded9] text-[11px] font-bold" th:href="${listUrl}">취소</a>
					<button class="h-11 rounded-xl bg-[#c75f56] text-[11px] font-bold text-white" type="submit">삭제</button>
				</div>
			</form>
		</div>
	</div>
</div>
<script>
	/* 회원 등록: 분류 선택 + 이름·연락처·가입일을 모두 입력해야 [등록] 활성 (프로토타입 동작) */
	(function () {
		const form = document.querySelector('[data-member-register]');
		if (!form) return;
		const submit = form.querySelector('[data-register-submit]');
		const fields = [...form.querySelectorAll('input[name="name"], input[name="phone"], input[name="joined"]')];
		const refresh = () => (submit.disabled = fields.some((f) => !f.value.trim()));
		fields.forEach((f) => f.addEventListener('input', refresh));
		form.querySelectorAll('[data-type-option]').forEach((opt) => opt.addEventListener('click', () => {
			form.querySelector('[data-type-value]').value = opt.dataset.typeOption;
			form.querySelector('[data-type-label]').textContent = opt.dataset.typeOption;
			form.querySelectorAll('[data-type-option]').forEach((o) => o.setAttribute('aria-selected', String(o === opt)));
			form.querySelector('[data-toggle-target="member-type"]').hidden = true;
		}));
		fields[0].focus();
	})();
</script>
</th:block>
</body>
</html>
