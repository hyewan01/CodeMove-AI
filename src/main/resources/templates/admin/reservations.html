<!DOCTYPE html>
<html th:replace="~{admin/fragments/layout :: layout('예약 관리', '', false, ~{::content})}" lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 예약 관리 (SCR-A-011) -->
<th:block th:fragment="content">
<div class="space-y-5 px-4 pb-28 pt-6" th:with="baseUrl=@{/admin/reservations(status=${status},q=${q})}">
	<h2 class="px-1 text-[24px] font-extrabold tracking-[-0.04em] text-[#346538]">예약 관리</h2>

	<section class="overflow-visible rounded-[20px] bg-white shadow-[0_5px_18px_rgba(36,58,39,.06)]">
		<form class="p-4" method="get" th:action="@{/admin/reservations}">
			<h3 class="text-[16px] font-extrabold text-[#29312b]">예약 목록</h3>
			<div class="relative mt-3 flex items-center justify-between">
				<select class="h-9 rounded-lg border border-[#dfe4df] bg-white px-2 text-[10px] font-semibold" name="status" data-auto-submit>
					<option th:each="s : ${ {'전체', '예약 완료', '예약 취소'} }" th:value="${s}" th:text="${s}" th:selected="${s == status}"></option>
				</select>
				<button aria-label="예약 검색" type="button" data-toggle="search" th:aria-expanded="${!#strings.isEmpty(q)}"
						class="grid h-9 w-9 place-items-center rounded-lg border border-[#dfe4df] text-[#59625b] aria-expanded:border-[#346538] aria-expanded:bg-[#edf3ed] aria-expanded:text-[#346538]">
					<svg th:replace="~{admin/fragments/icon :: icon('search', 16, '')}"></svg>
				</button>
				<div class="absolute bottom-11 right-0 z-10 flex items-center gap-2 rounded-xl border border-[#e1e5e1] bg-white p-3 shadow-[0_10px_28px_rgba(36,58,39,.15)]"
					 data-toggle-target="search" th:hidden="${#strings.isEmpty(q)}">
					<input class="h-9 w-48 rounded-lg border border-[#dfe4df] px-3 text-[10px] outline-none focus:border-[#346538]"
						   name="q" th:value="${q}" placeholder="이름, 휴대전화 또는 날짜를 입력하세요">
					<a class="flex h-9 items-center gap-1 rounded-lg bg-[#edf3ed] px-2 text-[9px] font-bold text-[#346538]" th:href="@{/admin/reservations}">
						<svg th:replace="~{admin/fragments/icon :: icon('refresh', 13, '')}"></svg> 초기화
					</a>
				</div>
			</div>
		</form>
		<div class="grid grid-cols-[28px_64px_1fr_68px_52px] bg-[#f7f8f7] px-2 py-2.5 text-center text-[8px] font-bold text-[#89908b]">
			<span>번호</span><span>분류</span><span>이름</span><span>결제</span><span>신청일</span>
		</div>
		<div class="px-2">
			<a th:each="row, it : ${rows}" th:href="${baseUrl} + '&page=' + ${page} + '&id=' + ${row.record.id}"
			   class="grid cursor-pointer grid-cols-[28px_64px_1fr_68px_52px] items-center border-b border-[#edf0ed] py-3 text-[9px] last:border-none hover:bg-[#fafbfa]">
				<span class="text-center text-[#8b928d]" th:text="${rowOffset + it.count}">1</span>
				<span class="justify-self-center rounded-full px-2 py-1 text-[8px] font-bold"
					  th:classappend="${row.displayStatus == '예약 취소'} ? 'bg-[#fbefed] text-[#b9574f]' : 'bg-[#edf4ed] text-[#346538]'"
					  th:text="${row.displayStatus}">예약 완료</span>
				<span class="truncate px-1 font-semibold" th:text="${row.record.name}">홍길동</span>
				<span th:replace="~{admin/reservations :: payBadge(${row.paymentStatus}, 'px-1.5 py-1 text-[7px]')}"></span>
				<span class="text-center text-[8px] text-[#7e867f]" th:text="${row.record.appliedDate}">26.09.27</span>
			</a>
		</div>
		<div th:replace="~{admin/fragments/list :: pager(${baseUrl})}"></div>
	</section>

	<section class="rounded-[20px] bg-white p-5 shadow-[0_5px_18px_rgba(36,58,39,.06)]">
		<h3 class="text-[16px] font-extrabold text-[#29312b]">분류별 현황</h3>
		<div class="mt-5 space-y-4">
			<div th:each="label, it : ${ {'예약 완료', '예약 취소'} }" th:with="c=${statusCounts[it.index]}">
				<div class="mb-1.5 flex justify-between text-[10px]">
					<span class="font-bold text-[#606862]" th:text="${label}">예약 완료</span>
					<span class="font-semibold" th:text="${c[0]} + '건 (' + ${c[1]} + '%)'">25건 (83%)</span>
				</div>
				<div class="h-2 overflow-hidden rounded-full bg-[#edf0ed]">
					<div class="h-full rounded-full" th:classappend="${it.index == 0} ? 'bg-[#4f8b55]' : 'bg-[#d26b62]'" th:style="'width: ' + ${c[1]} + '%'"></div>
				</div>
			</div>
		</div>
	</section>

	<!-- 예약 상세 정보 -->
	<div th:if="${selected}" th:with="r=${selected.record}"
		 class="absolute inset-x-0 my-0 bottom-[82px] top-[68px] z-50 grid place-items-center overflow-y-auto bg-[#1f2d21]/45 p-5 backdrop-blur-[2px]">
		<div class="my-auto w-full rounded-[20px] bg-white p-5 shadow-2xl">
			<div class="flex items-center justify-between">
				<h3 class="text-[17px] font-extrabold">예약 상세 정보</h3>
				<a aria-label="닫기" th:href="${baseUrl} + '&page=' + ${page}"><svg th:replace="~{admin/fragments/icon :: icon('x', 18, '')}"></svg></a>
			</div>
			<div class="mt-4 flex items-center justify-between">
				<span class="rounded-full px-2 py-1 text-[9px] font-bold"
					  th:classappend="${selected.displayStatus == '예약 취소'} ? 'bg-[#fbefed] text-[#b9574f]' : 'bg-[#edf4ed] text-[#346538]'"
					  th:text="${selected.displayStatus}">예약 완료</span>
				<span class="text-[9px] text-[#858d87]" th:text="'신청일 ' + ${r.appliedDate}">신청일</span>
			</div>
			<div class="mt-4 space-y-3">
				<section class="rounded-xl bg-[#f7f8f7] p-4">
					<h4 class="text-[11px] font-extrabold text-[#346538]">연동 정보</h4>
					<div class="mt-3 grid grid-cols-[88px_1fr] gap-y-2 text-[10px]">
						<span class="font-bold text-[#737b75]">회원 정보</span><span th:text="${r.name} + ' · ' + ${r.phone}"></span>
						<span class="font-bold text-[#737b75]">견적 번호</span><span th:text="'EST-' + ${#numbers.formatInteger((r.id - 1) % 11 + 1, 4)}"></span>
						<span class="font-bold text-[#737b75]">예약 번호</span><span th:text="'RSV-' + ${#numbers.formatInteger(r.id, 4)}"></span>
					</div>
				</section>
				<section class="rounded-xl bg-[#f7f8f7] p-4">
					<h4 class="text-[11px] font-extrabold text-[#346538]">예약 상세 내역</h4>
					<div class="mt-3 grid grid-cols-[88px_1fr] gap-y-2 text-[10px]">
						<span class="font-bold text-[#737b75]">이사 유형</span><span th:text="${r.service}"></span>
						<span class="font-bold text-[#737b75]">이사일</span><span th:text="${r.movingDate} ?: '-'"></span>
						<span class="font-bold text-[#737b75]">이사 시간</span><span th:text="${r.movingTime} ?: '-'"></span>
						<span class="font-bold text-[#737b75]">출발지</span><span class="leading-4" th:text="${r.origin}"></span>
						<span class="font-bold text-[#737b75]">도착지</span><span class="leading-4" th:text="${r.destination}"></span>
					</div>
				</section>
				<section class="rounded-xl border border-[#dfe6df] bg-white p-4">
					<div class="flex items-center justify-between">
						<h4 class="text-[11px] font-extrabold text-[#346538]">계약금 결제</h4>
						<span th:replace="~{admin/reservations :: payBadge(${selected.paymentStatus}, 'px-2 py-1 text-[8px]')}"></span>
					</div>
					<div class="mt-3 flex items-center justify-between text-[10px]">
						<span class="font-bold text-[#737b75]">계약금 10%</span>
						<strong class="text-[13px] text-[#29312b]" th:text="${deposit}">132,000원</strong>
					</div>
					<p class="mt-2 rounded-lg bg-[#f7f8f7] px-3 py-2 text-[10px] font-bold text-[#59625b]"
					   th:text="${selected.paymentStatus == '결제 취소'} ? '결제 취소' : ${selected.paymentStatus} + '(' + ${deposit} + ')'"></p>
					<form th:if="${selected.paymentStatus == '결제 대기'}" method="post" th:action="@{/admin/reservations/{id}/paid(id=${r.id})}">
						<input type="hidden" name="back" th:value="${currentUrl}">
						<button class="mt-3 h-10 w-full rounded-xl bg-[#346538] text-[10px] font-extrabold text-white" type="submit">결제 완료</button>
					</form>
				</section>
			</div>
		</div>
	</div>
</div>
</th:block>

<!-- 결제 상태 배지 -->
<span th:fragment="payBadge(status, size)" class="justify-self-center rounded-full font-bold"
	  th:classappend="${size} + ' ' + (${status == '결제 완료'} ? 'bg-[#edf3ed] text-[#346538]' : (${status == '결제 취소'} ? 'bg-[#f1f2f1] text-[#737b75]' : 'bg-[#fff4e8] text-[#9b7127]'))"
	  th:text="${status}">결제 대기</span>
</body>
</html>
