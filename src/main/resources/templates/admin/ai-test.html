<!DOCTYPE html>
<html th:replace="~{admin/fragments/layout :: layout('AI 영상 분석 테스트', '', false, ~{::content})}" lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- AI 영상 분석 테스트 (가이드 2·7단계, 개발·관리자 전용) -->
<th:block th:fragment="content">
<div class="space-y-5 px-4 pb-28 pt-6">
	<div class="px-1">
		<h2 class="text-[26px] font-extrabold tracking-[-0.04em] text-[#346538]">AI 영상 분석 테스트</h2>
		<p class="mt-1 text-[14px] leading-relaxed text-[#7d857f]">영상을 올려 품목·부피 인식 결과와 토큰·비용·시간을 확인해요. 고객 견적과 같은 분석 코드를 씁니다.</p>
	</div>

	<section class="space-y-2 rounded-[20px] bg-white p-5 text-[14px] shadow-[0_5px_18px_rgba(36,58,39,.06)]">
		<div class="flex justify-between"><span class="text-[#7d857f]">모델</span><strong class="text-[#303832]" th:text="${model}">gemini-2.5-flash</strong></div>
		<div class="flex justify-between"><span class="text-[#7d857f]">프롬프트 버전</span><strong class="text-[#303832]" th:text="${promptVersion}">v1</strong></div>
		<div class="flex justify-between"><span class="text-[#7d857f]">API 키</span>
			<strong th:class="${configured} ? 'text-[#346538]' : 'text-[#c2410c]'" th:text="${configured} ? '설정됨' : '없음 (GEMINI_API_KEY)'">설정됨</strong></div>
	</section>

	<form class="space-y-3 rounded-[20px] bg-white p-5 shadow-[0_5px_18px_rgba(36,58,39,.06)]" method="post" enctype="multipart/form-data"
		  th:action="@{/admin/ai-test}" data-ai-test-form>
		<p class="text-[17px] font-extrabold text-[#303832]">새 분석</p>
		<p class="rounded-xl bg-[#fff4e8] px-3 py-2 text-[13px] font-semibold text-[#9a4f14]" th:if="${error}" th:text="${error}">오류</p>
		<input class="block w-full text-[14px] text-[#535b55]" type="file" name="video" accept="video/*" required>
		<label class="flex items-center justify-between gap-3 text-[14px] text-[#535b55]">
			<span>정답 목록과 비교</span>
			<select class="h-9 rounded-lg border border-[#dfe4df] bg-white px-3 text-[14px] font-semibold text-[#535b55]" name="truth">
				<option value="">비교 안 함</option>
				<option th:each="s : ${sets}" th:value="${s}" th:text="${s}">house-01</option>
			</select>
		</label>
		<button class="h-12 w-full rounded-2xl bg-[#346538] text-[15px] font-bold text-white disabled:opacity-60" type="submit"
				th:disabled="${!configured}" data-ai-test-submit>분석하기</button>
		<p class="text-[12px] text-[#969d98]">1분 영상 기준 30초~2분 걸려요. 끝나면 결과 화면으로 이동합니다.</p>
	</form>

	<section class="space-y-3">
		<p class="px-1 text-[17px] font-extrabold text-[#303832]">분석 기록 <span class="text-[#346538]" th:text="${#lists.size(history)} + '건'">0건</span></p>
		<p class="rounded-[20px] bg-white p-5 text-center text-[14px] text-[#969d98] shadow-[0_5px_18px_rgba(36,58,39,.06)]" th:if="${#lists.isEmpty(history)}">아직 기록이 없어요</p>
		<a class="block rounded-[20px] bg-white p-4 shadow-[0_5px_18px_rgba(36,58,39,.06)]" th:each="h : ${history}" th:href="@{/admin/ai-test/{id}(id=${h.analysisId})}">
			<div class="flex items-center justify-between gap-2">
				<strong class="truncate text-[15px] text-[#303832]" th:text="${h.video}">video.mp4</strong>
				<span class="shrink-0 rounded-full px-2 py-0.5 text-[12px] font-bold"
					  th:classappend="${h.success} ? 'bg-[#e8f3e9] text-[#346538]' : 'bg-[#fff4e8] text-[#c2410c]'"
					  th:text="${h.success} ? '성공' : '실패 ' + ${h.errorCode}">성공</span>
			</div>
			<p class="mt-1 text-[13px] text-[#7d857f]"
			   th:text="${#strings.substring(h.at, 0, 16).replace('T', ' ')} + ' · ' + ${h.model} + ' · ' + ${h.promptVersion}">2026-11-23 21:30 · gemini · v1</p>
			<p class="mt-1 text-[13px] text-[#535b55]" th:if="${h.success}"
			   th:text="${#lists.size(h.items)} + '줄 · ' + ${#numbers.formatDecimal(h.totalCbm, 1, 1)} + ' CBM · 확인 필요 ' + ${h.reviewCount} + ' · 토큰 ' + ${#numbers.formatInteger(h.usage.totalTokens, 1, 'COMMA')} + ' · $' + ${#numbers.formatDecimal(h.costUsd, 1, 4)} + ' · ' + ${#numbers.formatDecimal(h.totalMs / 1000.0, 1, 1)} + '초'">결과</p>
			<p class="mt-1 text-[13px] text-[#c2410c]" th:unless="${h.success}" th:text="${h.message}">오류</p>
		</a>
	</section>
</div>
<script>
	// 분석은 오래 걸리므로 두 번 누르지 않게
	document.querySelector('[data-ai-test-form]')?.addEventListener('submit', () => {
		const b = document.querySelector('[data-ai-test-submit]');
		setTimeout(() => { b.disabled = true; b.textContent = '분석 중… (최대 몇 분)'; }, 0);
	});
</script>
</th:block>
</body>
</html>
