<!DOCTYPE html>
<html th:replace="~{admin/fragments/layout :: layout('비밀번호 변경', '', true, ~{::content})}" lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 관리자 비밀번호 변경 -->
<th:block th:fragment="content">
<div class="h-full overflow-y-auto bg-[#f5f6f8] px-4 pb-6 pt-5">
	<h1 class="text-[21px] font-extrabold tracking-[-0.04em] text-[#253328]">비밀번호 변경</h1>
	<p th:if="${notice}" class="mt-3 rounded-xl bg-[#edf3ed] px-3 py-2.5 text-[14px] font-semibold text-[#346538]" th:text="${notice}"></p>
	<p th:if="${error}" role="alert" class="mt-3 rounded-xl bg-[#fff0ee] px-3 py-2.5 text-[14px] font-semibold text-[#b64b42]" th:text="${error}"></p>

	<form class="mt-4 space-y-3 rounded-[18px] bg-white p-4 shadow-[0_4px_16px_rgba(36,58,39,.05)]" method="post" th:action="@{/admin/password}">
		<h2 class="text-[15px] font-extrabold text-[#303832]">내 비밀번호</h2>
		<input class="h-12 w-full rounded-xl border border-[#dfe4df] bg-[#f7f8f7] px-3 text-[15px] outline-none focus:border-[#89a18b]" type="password" name="current" placeholder="지금 비밀번호" aria-label="지금 비밀번호" autocomplete="current-password" required>
		<input class="h-12 w-full rounded-xl border border-[#dfe4df] bg-[#f7f8f7] px-3 text-[15px] outline-none focus:border-[#89a18b]" type="password" name="next" placeholder="새 비밀번호 (6자 이상)" aria-label="새 비밀번호" autocomplete="new-password" minlength="6" required>
		<input class="h-12 w-full rounded-xl border border-[#dfe4df] bg-[#f7f8f7] px-3 text-[15px] outline-none focus:border-[#89a18b]" type="password" name="confirm" placeholder="새 비밀번호 다시 입력" aria-label="새 비밀번호 다시 입력" autocomplete="new-password" minlength="6" required>
		<button class="h-12 w-full rounded-xl bg-[#346538] text-[15px] font-extrabold text-white" type="submit">바꾸기</button>
	</form>

	<section class="mt-5" th:unless="${#lists.isEmpty(pending)}">
		<h2 class="px-1 text-[15px] font-extrabold text-[#303832]">비밀번호가 없는 관리자</h2>
		<p class="mt-1 px-1 text-[13px] text-[#8a918c]">첫 비밀번호를 정해야 로그인할 수 있어요.</p>
		<form th:each="a : ${pending}" class="mt-3 space-y-3 rounded-[18px] bg-white p-4 shadow-[0_4px_16px_rgba(36,58,39,.05)]" method="post" th:action="@{/admin/password/first}">
			<input type="hidden" name="adminId" th:value="${a.adminId}">
			<strong class="block text-[15px] text-[#303832]" th:text="${a.adminName}">관리자</strong>
			<input class="h-12 w-full rounded-xl border border-[#dfe4df] bg-[#f7f8f7] px-3 text-[15px] outline-none focus:border-[#89a18b]" type="password" name="next" placeholder="첫 비밀번호 (6자 이상)" th:aria-label="${a.adminName} + ' 첫 비밀번호'" autocomplete="new-password" minlength="6" required>
			<input class="h-12 w-full rounded-xl border border-[#dfe4df] bg-[#f7f8f7] px-3 text-[15px] outline-none focus:border-[#89a18b]" type="password" name="confirm" placeholder="다시 입력" th:aria-label="${a.adminName} + ' 첫 비밀번호 다시 입력'" autocomplete="new-password" minlength="6" required>
			<button class="h-11 w-full rounded-xl bg-[#edf3ed] text-[14px] font-extrabold text-[#346538]" type="submit">정하기</button>
		</form>
	</section>
</div>
</th:block>
</body>
</html>
