<!DOCTYPE html>
<html th:replace="~{admin/fragments/layout :: layout('알림 내역', '', true, ~{::content})}" lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 알림 내역 (SCR-A-014): 관리자·사용자 상단 팝업 알림 기록 -->
<th:block th:fragment="content">
<div class="flex h-full min-h-0 flex-col overflow-hidden bg-[#f5f6f8]" data-history>
	<header class="relative flex h-14 shrink-0 items-center justify-center border-b border-[#e5e9e5] bg-white">
		<h1 class="text-base font-extrabold text-[#29322b]">알림 내역</h1>
		<a aria-label="알림 내역 닫기" class="absolute right-3 grid h-10 w-10 place-items-center rounded-full text-[#525c54] hover:bg-[#f2f4f2]" th:href="@{/admin/notifications}">
			<svg th:replace="~{admin/fragments/icon :: icon2('x', 20, '')}"></svg></a>
	</header>

	<div class="shrink-0 p-4 pb-2">
		<label class="flex items-center gap-2 rounded-full bg-[#ecefee] px-4 py-3">
			<svg th:replace="~{admin/fragments/icon :: icon2('search', 17, 'shrink-0 text-[#858d87]')}"></svg>
			<input class="min-w-0 flex-1 bg-transparent text-sm text-[#303832] outline-none placeholder:text-[#9ca29e]" placeholder="회원명 또는 알림 내용을 검색하세요" type="search" data-history-query>
			<span class="text-[10px] font-bold text-[#718074]" data-history-count hidden></span>
		</label>
		<div class="mt-3 grid grid-cols-2 gap-2">
			<div class="rounded-xl bg-white px-3 py-2.5">
				<span class="block text-[9px] font-bold text-[#858d87]">관리자 수신</span>
				<strong class="mt-0.5 block text-sm text-[#346538]" th:text="${adminCount} + '건'">8건</strong>
			</div>
			<div class="rounded-xl bg-white px-3 py-2.5">
				<span class="block text-[9px] font-bold text-[#858d87]">사용자 수신</span>
				<strong class="mt-0.5 block text-sm text-[#346538]" th:text="${userCount} + '건'">10건</strong>
			</div>
		</div>
	</div>

	<div class="flex-1 overflow-y-auto px-4 pb-5 pt-2">
		<div class="mb-2 flex items-center justify-between px-1">
			<p class="text-xs font-bold text-[#68716a]">전체 팝업 알림 기록</p>
			<span class="text-[10px] font-semibold text-[#969d98]">최신 발송순</span>
		</div>
		<div class="space-y-2">
			<article th:each="r : ${records}" class="flex w-full items-center gap-3 rounded-2xl border border-white bg-white p-3.5 text-left shadow-[0_3px_12px_rgba(36,58,39,.05)]"
					 th:data-search="${r.name} + ' ' + ${r.message} + ' ' + (${r.category} ?: '') + ' ' + ${r.recipient}" data-record>
				<span class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-[#edf3ed] text-sm font-extrabold text-[#346538]" th:text="${r.initial()}">홍</span>
				<span class="min-w-0 flex-1">
					<span class="flex items-center gap-1"><strong class="truncate text-sm text-[#303832]" th:text="${r.name}"></strong></span>
					<span class="mt-1 flex items-center gap-1.5">
						<span class="rounded-full px-1.5 py-0.5 text-[8px] font-bold" th:classappend="${r.recipient == '관리자'} ? 'bg-[#fff0ee] text-[#b64b42]' : 'bg-[#edf3ed] text-[#346538]'"
							  th:text="${r.recipient} + ' 수신'"></span>
						<span th:if="${r.category}" class="truncate text-[9px] font-semibold text-[#858d87]" th:text="${r.category}"></span>
					</span>
					<span class="mt-1 block truncate text-xs text-[#747c76]" th:text="${r.message}"></span>
				</span>
				<span class="shrink-0 self-start pt-1 text-[9px] text-[#9aa09b]" th:text="${r.time}"></span>
			</article>
			<div class="py-20 text-center" data-history-empty hidden>
				<span class="mx-auto grid h-12 w-12 place-items-center rounded-full bg-white text-[#9aa19b]"><svg th:replace="~{admin/fragments/icon :: icon2('search', 21, '')}"></svg></span>
				<p class="mt-3 text-xs font-semibold text-[#747c76]">검색 결과가 없습니다.</p>
			</div>
		</div>
	</div>
</div>
<script>
	(function () {
		const root = document.querySelector('[data-history]');
		const records = [...root.querySelectorAll('[data-record]')];
		const count = root.querySelector('[data-history-count]');
		root.querySelector('[data-history-query]').addEventListener('input', (e) => {
			const q = e.target.value.trim().toLocaleLowerCase();
			let n = 0;
			records.forEach((r) => { const show = !q || r.dataset.search.toLocaleLowerCase().includes(q); r.hidden = !show; if (show) n++; });
			count.hidden = !q;
			count.textContent = `${n}건`;
			root.querySelector('[data-history-empty]').hidden = n > 0;
		});
	})();
</script>
</th:block>
</body>
</html>
