<!DOCTYPE html>
<html th:replace="~{admin/fragments/layout :: layout('알림 관리', '', true, ~{::content})}" lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 알림 관리 (SCR-A-013) -->
<th:block th:fragment="content">
<div class="h-full overflow-y-auto bg-[#f5f6f8] px-4 pb-6 pt-5">
	<div class="mb-5">
		<p class="text-[10px] font-bold tracking-[0.12em] text-[#879189]">MESSAGE SERVICE</p>
		<h1 class="mt-1 text-xl font-extrabold tracking-[-0.04em] text-[#346538]">알림 관리</h1>
	</div>

	<section class="rounded-[22px] border border-white bg-white p-5 shadow-[0_8px_24px_rgba(36,58,39,.08)]">
		<div class="flex items-center gap-2">
			<span class="grid h-8 w-8 place-items-center rounded-xl bg-[#edf3ed] text-[#346538]"><svg th:replace="~{admin/fragments/icon :: icon2('bell', 18, '')}"></svg></span>
			<h2 class="text-sm font-extrabold text-[#3a403b]">자동 메시징 발송 현황</h2>
		</div>
		<div class="py-7 text-center">
			<strong class="text-[42px] font-extrabold tracking-[-0.06em] text-[#346538]">45<span class="ml-1 text-lg tracking-normal">건</span></strong>
			<p class="mt-2 text-xs font-semibold text-[#768078]">오늘 발송된 자동 알림 메시지 수</p>
		</div>
		<div class="flex items-center justify-center gap-2 rounded-xl bg-[#f2f6f2] py-2.5 text-[10px] font-bold text-[#59705c]">
			<span class="h-2 w-2 rounded-full bg-[#4f8b55]"></span>자동 메시징 시스템 정상 운영 중
		</div>
	</section>

	<div class="mt-5 space-y-3">
		<a th:each="m : ${ { {'/admin/notifications/history', 'document', '알림 내역', '관리자·사용자 상단 팝업 알림 기록 확인'},
						   {'/admin/notifications/messaging', 'settings', '자동 메시징 관리', '자동 알림 운영 상태와 발송 환경 관리'} } }"
		   class="flex w-full items-center gap-4 rounded-[18px] border border-white bg-white p-4 text-left shadow-[0_5px_18px_rgba(36,58,39,.06)] transition active:scale-[.99]"
		   th:href="@{${m[0]}}">
			<span class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-[#edf3ed] text-[#346538]"><svg th:replace="~{admin/fragments/icon :: icon2(${m[1]}, 22, '')}"></svg></span>
			<span class="min-w-0 flex-1">
				<strong class="block text-sm text-[#2e3630]" th:text="${m[2]}"></strong>
				<span class="mt-1 block text-xs leading-5 text-[#858d87]" th:text="${m[3]}"></span>
			</span>
			<svg th:replace="~{admin/fragments/icon :: icon2('arrowRight', 18, 'text-[#9aa19b]')}"></svg>
		</a>
	</div>
</div>
</th:block>
</body>
</html>
