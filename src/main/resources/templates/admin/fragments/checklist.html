<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 예약 상세 · 견적 수정에 넣는 "이사 준비 체크리스트" 한 줄 → 누르면 그 고객의 단계별 체크 현황 -->
<a th:fragment="row(p)" class="flex items-center gap-3 rounded-xl bg-white px-3 py-2.5 shadow-[0_2px_8px_rgba(36,58,39,.05)]"
   th:href="@{/admin/checklist/customers(open=${p.memberId})}">
	<span class="shrink-0 text-[14px] font-bold text-[#737b75]">체크리스트</span>
	<span class="h-1.5 min-w-0 flex-1 overflow-hidden rounded-full bg-[#e8eee8]">
		<i class="block h-full rounded-full bg-[#346538]" th:style="'width:' + ${p.view.percent()} + '%'"></i></span>
	<b class="shrink-0 text-[14px] font-extrabold text-[#346538]" th:text="${p.view.percent()} + '%'">3%</b>
	<span class="shrink-0 text-[13px] text-[#8a918c]" th:text="${p.view.done} + '/' + ${p.view.total}">1/36</span>
	<svg th:replace="~{admin/fragments/icon :: icon2('arrowRight', 15, 'shrink-0 text-[#9aa19b]')}"></svg>
</a>
</body>
</html>
