<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
	관리자 아이콘
	icon(name, size, cls)  : App.tsx Icon (선 두께 1.8)
	icon2(name, size, cls) : Icon.tsx (채팅·알림 관리, 선 두께 2)
-->
<svg th:fragment="icon(name, size, cls)" aria-hidden="true" th:class="${cls}" fill="none"
	 th:width="${size}" th:height="${size}" viewBox="0 0 24 24">
	<g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8">
		<th:block th:replace="~{admin/fragments/icon :: paths(${name})}"></th:block>
	</g>
</svg>

<svg th:fragment="icon2(name, size, cls)" aria-hidden="true" th:class="${cls}" fill="none"
	 th:width="${size}" th:height="${size}" viewBox="0 0 24 24">
	<g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
		<th:block th:replace="~{admin/fragments/icon :: paths(${name})}"></th:block>
	</g>
</svg>

<th:block th:fragment="paths(name)" th:switch="${name}">
	<th:block th:case="'arrowRight'"><path d="m9 18 6-6-6-6"/></th:block>
	<th:block th:case="'alert'"><path d="M10.3 3.7 2.5 18a2 2 0 0 0 1.8 3h15.4a2 2 0 0 0 1.8-3L13.7 3.7a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></th:block>
	<th:block th:case="'bell'"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></th:block>
	<th:block th:case="'calendar'"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></th:block>
	<th:block th:case="'camera'"><path d="M4 7h3l1.5-2h7L17 7h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></th:block>
	<th:block th:case="'chat'"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></th:block>
	<th:block th:case="'check'"><path d="m5 12 4 4L19 6"/></th:block>
	<th:block th:case="'chevron'"><path d="m7 10 5 5 5-5"/></th:block>
	<th:block th:case="'clock'"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></th:block>
	<th:block th:case="'coin'"><circle cx="12" cy="12" r="9"/><path d="M8.5 9h7M8 12h8M10 9l1.2 7M14 9l-1.2 7"/></th:block>
	<th:block th:case="'document'"><path d="M6 2h9l4 4v16H6z"/><path d="M14 2v5h5M9 13h6M9 17h6"/></th:block>
	<th:block th:case="'edit'"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></th:block>
	<th:block th:case="'help'"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.4 2.4 0 1 1 3.3 2.2c-.8.4-1.1.9-1.1 1.8M12 17h.01"/></th:block>
	<th:block th:case="'home'"><path d="m3 11 9-8 9 8"/><path d="M5 10v11h14V10M9 21v-7h6v7"/></th:block>
	<th:block th:case="'logout'"><path d="M10 5H5v14h5M14 8l4 4-4 4M18 12H9"/></th:block>
	<th:block th:case="'menu'"><path d="M4 7h16M4 12h16M4 17h16"/></th:block>
	<th:block th:case="'people'"><circle cx="9" cy="8" r="4"/><path d="M2 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2M17 4a4 4 0 0 1 0 8M19 15a5 5 0 0 1 3 4v2"/></th:block>
	<th:block th:case="'pin'"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0"/><circle cx="12" cy="10" r="2.5"/></th:block>
	<th:block th:case="'refresh'"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M6.1 8a7 7 0 0 1 11.6-2.1L20 8M4 16l2.3 2.1A7 7 0 0 0 17.9 16"/></th:block>
	<th:block th:case="'robot'"><rect x="4" y="7" width="16" height="13" rx="3"/><path d="M12 3v4M9 3h6M8 12h.01M16 12h.01M8 16h8"/></th:block>
	<th:block th:case="'search'"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></th:block>
	<th:block th:case="'send'"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></th:block>
	<th:block th:case="'settings'"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></th:block>
	<th:block th:case="'star'"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/></th:block>
	<th:block th:case="'truck'"><path d="M3 6h11v11H3zM14 10h4l3 3v4h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></th:block>
	<th:block th:case="'trash'"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14"/><path d="M10 11v6M14 11v6"/></th:block>
	<th:block th:case="'user'"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></th:block>
	<th:block th:case="'x'"><path d="m6 6 12 12M18 6 6 18"/></th:block>
</th:block>
</body>
</html>
