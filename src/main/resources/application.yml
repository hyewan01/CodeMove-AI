server:
  servlet:
    session:
      # devtools 재시작 시 세션 복원 실패(ClassNotFoundException) 방지
      persistent: false
      # 세션은 쿠키로만 유지 (URL에 ;jsessionid 붙지 않게)
      tracking-modes: cookie
  tomcat:
    # 한도를 넘는 업로드도 연결을 끊지 않고 오류 응답을 보내도록
    max-swallow-size: 1100MB

spring:
  application:
    name: codemove
  servlet:
    multipart:
      # 이사 견적 영상 업로드 (최대 5분 영상, quote.js MAX_VIDEO_BYTES와 맞춤)
      max-file-size: 1GB
      max-request-size: 1100MB
  profiles:
    # 실제 DB 접속 정보는 application-local.yml(Git 제외)에 작성
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    # 환경변수(DB_URL, DB_USERNAME, DB_PASSWORD) 또는 application-local.yml 값 사용
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
      connection-test-query: SELECT 1 FROM DUAL

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.codemove
  configuration:
    map-underscore-to-camel-case: true
    # Oracle은 NULL 바인딩 시 JDBC 타입 지정 필요
    jdbc-type-for-null: NULL
