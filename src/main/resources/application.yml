spring:
  application:
    name: codemove
  profiles:
    # 실제 DB 접속 정보는 application-local.yml(Git 제외)에 작성
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    # 환경변수(DB_URL, DB_USERNAME, DB_PASSWORD) 또는 application-local.yml 값 사용
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
      connection-test-query: SELECT 1 FROM DUAL

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.codemove
  configuration:
    map-underscore-to-camel-case: true
    # Oracle은 NULL 바인딩 시 JDBC 타입 지정 필요
    jdbc-type-for-null: NULL
