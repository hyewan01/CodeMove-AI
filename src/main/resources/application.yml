server:
  # HTML · CSS · JS 를 압축해서 보냄
  compression:
    enabled: true
  servlet:
    session:
      # devtools 재시작 시 세션 복원 실패(ClassNotFoundException) 방지
      persistent: false
      # 세션은 쿠키로만 유지 (URL에 ;jsessionid 붙지 않게)
      tracking-modes: cookie
  tomcat:
    # 한도를 넘는 업로드도 연결을 끊지 않고 오류 응답을 보내도록
    max-swallow-size: 1100MB
    # 이사 요청 폼은 품목 한 줄에 칸 7개(items[i].name·size·count·…)라, 기본 50칸이면 AI 가 짐을 8줄 넘게
    # 찾을 때 제출이 막힘(MaxUploadSizeExceededException). 2000칸 ≈ 품목 280줄
    max-part-count: 2000

spring:
  # 오류 화면(templates/error.html)에 내부 코드 · SQL 을 보이지 않음. 자세한 내용은 서버 로그
  web:
    # 글꼴 · 그림 · CSS · JS 는 브라우저에 저장. 주소에 내용 값이 붙어(customer-….css) 바뀌면 저절로 새로 받음
    resources:
      cache:
        cachecontrol:
          max-age: 7d
      chain:
        cache: true
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**,/fonts/**,/assets/**
    error:
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
  application:
    name: codemove
  servlet:
    multipart:
      # 이사 견적 영상 업로드 (최대 5분 영상, quote.js MAX_VIDEO_BYTES와 맞춤)
      max-file-size: 1GB
      max-request-size: 1100MB
  profiles:
    # 실제 DB 접속 정보는 application-local.yml(Git 제외)에 작성
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    # 환경변수(DB_URL, DB_USERNAME, DB_PASSWORD) 또는 application-local.yml 값 사용
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      # DB 가 멀고 네트워크가 느릴 때가 많음: 느린 연결을 죽은 것으로 보지 않게 5초까지 기다리고, 3개는 늘 열어 둠.
      # 노트북 절전에서 깨어나면 WakeUpWatch 가 연결을 모두 새로 맺음
      maximum-pool-size: 8
      minimum-idle: 3
      keepalive-time: 60000
      validation-timeout: 5000
      connection-timeout: 30000
      connection-test-query: SELECT 1 FROM DUAL
      data-source-properties:
        # 결과를 한 번에 200줄씩 받고(기본 10줄), 쓰던 SQL 을 기억해 왕복을 줄임
        defaultRowPrefetch: 200
        oracle.jdbc.implicitStatementCacheSize: 100
        # 긴 글(CLOB)도 줄과 함께 받음
        oracle.jdbc.defaultLobPrefetchSize: 65536
        # 연결 시도(로그인까지) 5초, 응답 없는 조회는 15초 뒤 포기 (끊긴 연결이 새 연결을 막지 않게)
        oracle.net.CONNECT_TIMEOUT: 5000
        oracle.net.OUTBOUND_CONNECT_TIMEOUT: 5000
        oracle.jdbc.ReadTimeout: 15000

codemove:
  ai:
    gemini:
      # API 키는 application-local.yml(Git 제외) 또는 환경변수 GEMINI_API_KEY
      # gemini-2.5-flash 는 신규 사용자에게 막힘(2026-11-23 확인). 3.8-flash 는 무료 등급 503 혼잡이 잦음
      model: gemini-4-hydrogen
      thinking-level: low
      # 주 모델이 혼잡(503)·한도(429)일 때 차례로 시도. 비용은 주 모델 단가로 계산되므로 기록의 모델명을 확인
      fallback-models: gemini-3.5-flash,gemini-flash-latest,gemini-3.8-flash
      timeout-sec: 180
      # 100만 토큰당 달러. Google 출시 블로그(Gemini 4 Hydrogen) 기준. Cloud 요금표는 출력 단가가 달라 확인 필요
      price-in-per-1m: 1.50
      price-out-per-1m: 7.50
      price-date: 2026-11-23
    # 분석 기록(토큰·비용·결과 JSON) 폴더, Git 제외
    log-dir: ai-logs
    # 테스트 영상 폴더 (관리자 AI 테스트 화면). 개인 경로라 application-local.yml 에 적습니다.
    # 영상과 같은 이름의 .csv 를 두면 정답 목록으로 비교 (형식: docs/estimate/testset/*.csv)
    test-video-dir: ""
  # 휴대전화 인증. 문자 발송(auth/SmsSender)을 붙이기 전에는 아래 시연 번호만 시연 인증번호로 통과합니다.
  # 실제 고객 번호는 적지 마세요. 값은 application-local.yml(Git 제외)에 적음 (번호는 쉼표로 구분)
  auth:
    demo-phones: ""
    demo-code: ""
  # 계약금 온라인 결제 (토스페이먼츠 결제위젯). 키는 application-local.yml(Git 제외)에 적음.
  # 테스트 키(test_gck… / test_gsk…): 개발자센터(developers.tosspayments.com) 개인 가입으로 받음, 실제 돈 안 빠짐
  # 실결제 키(live_…): 업체 사업자로 결제대행 계약 후 받음. 둘 다 비어 있으면 결제 버튼 대신 "준비 중" 안내
  pay:
    toss:
      client-key: ""
      secret-key: ""

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.codemove
  configuration:
    map-underscore-to-camel-case: true
    # Oracle은 NULL 바인딩 시 JDBC 타입 지정 필요
    jdbc-type-for-null: NULL
