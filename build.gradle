plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.9'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.codemove'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	// Oracle 11g XE(11.2) 호환: 23.x 드라이버(ojdbc11/17)는 19c 미만 DB를 지원하지 않아 19.x 고정
	runtimeOnly 'com.oracle.database.jdbc:ojdbc8:19.33.0.0'
	runtimeOnly 'com.oracle.database.nls:orai18n:19.33.0.0'
	// 손 없는 날: 한국 음력(단기력) 변환 DangiCalendar (common/LunarDays)
	implementation 'com.ibm.icu:icu4j:78.3'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// 품목 규격표(팀원 조사 CSV)를 그대로 클래스패스에 넣음 → ItemCatalog 가 읽음 (V4 DB 적용 전까지)
processResources {
	from('docs/estimate/data') {
		include 'item-master.csv', 'item-alias.csv', 'truck-capacity.csv', 'fee-*.csv', 'estimate-rules.csv'
		into 'estimate'
	}
	// 영상 분석 정답 목록 (관리자 AI 테스트 화면의 채점용)
	from('docs/estimate/testset') {
		include '*.csv'
		into 'estimate/testset'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
